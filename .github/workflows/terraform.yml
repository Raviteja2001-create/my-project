
        
          
        
name: Terraform pipeline

on:
  push:
    branches:
      - feature

jobs:
  ec2_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Read main.tf
        run: cat main.tf

      - name: Read outputs.tf
        run: cat outputs.tf

      - name: Read providers.tf
        run: cat providers.tf

      - name: Read variables.tf
        run: cat variables.tf

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
